[package]
name = "botc-scripter"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
ureq = "3.5.0"
url = "2.5.8"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
# If enabled, the script_data.json is baked in at compile time.
# This checks correct at compile, but also requires recompile when data changes
# Left disabled by default, and is ignored when running tests.
static-data = []